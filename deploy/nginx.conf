server {
    listen 8082;
    listen [::]:8082;
    server_name _;
    root /var/www/consulta-resultado-votacao-presidente-2026-oz-codex;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ~* \.test\.js$ { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(css|js|svg)$ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; add_header X-Content-Type-Options nosniff always; }
    location / { try_files $uri $uri/ =404; }
}
